apiVersion: apps/v1
kind: Deployment
metadata:
  name: memu-acquisition
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: memu-acquisition}
  template:
    metadata:
      labels: {app: memu-acquisition}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: acquisition
          image: memulife-acquisition:1.3.0
          args: [acquisition]
          ports: [{name: http, containerPort: 5073}]
          envFrom:
            - configMapRef: {name: memu-acquisition-config}
            - secretRef: {name: memu-auth}
            - secretRef: {name: memu-acquisition-secrets}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: temporary, mountPath: /tmp}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '2', memory: 1Gi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 150
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 150
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: memu-acquisition-data}
        - name: temporary
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: memu-acquisition
spec:
  selector: {app: memu-acquisition}
  ports: [{name: http, port: 5073, targetPort: http}]
