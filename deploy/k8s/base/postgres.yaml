apiVersion: v1
kind: Service
metadata:
  name: memu-postgres
spec:
  selector: {app: memu-postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: memu-postgres
spec:
  serviceName: memu-postgres
  replicas: 1
  selector:
    matchLabels: {app: memu-postgres}
  template:
    metadata:
      labels: {app: memu-postgres}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.2-pg17-trixie
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: memu}
            - {name: POSTGRES_DB, value: memu}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: memu-postgres-auth, key: POSTGRES_PASSWORD}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '2', memory: 2Gi}
          readinessProbe:
            exec: {command: [pg_isready, -U, memu, -d, memu]}
            periodSeconds: 150
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 20Gi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-memory-services
spec:
  podSelector:
    matchLabels: {app: memu-postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: memu-core}
        - podSelector:
            matchLabels: {app: memu-acquisition}
      ports: [{protocol: TCP, port: 5432}]
