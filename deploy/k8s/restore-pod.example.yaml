# Apply only after creating the target PVC, with core stopped. Delete after verified import.
apiVersion: v1
kind: Pod
metadata:
  name: memu-restore
  namespace: memu
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  containers:
    - name: restore
      image: memulife-core:1.3.0
      command: [sh, -c, 'mkdir -p /data/memory && exec sleep infinity']
      volumeMounts:
        - {name: data, mountPath: /data}
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 250m, memory: 128Mi}
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: memu-data}
