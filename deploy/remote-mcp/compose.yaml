name: memulife-remote-mcp

# Linux Docker Engine (rootful). Host networking uses the host's Tailscale
# routing. Tailscale runs on both hosts, independently of this container.
services:
  mcp:
    image: ${MEMU_MCP_IMAGE:-memulife-mcp:1.3.0}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: mcp
    network_mode: host
    env_file:
      - path: ./mcp.env
        format: raw
    environment:
      MEMU_MCP_HOST: 127.0.0.1
      MEMU_MCP_PORT: "5071"
      MEMU_MCP_URL: https://${MEMU_PUBLIC_HOST:?Set MEMU_PUBLIC_HOST in .env}/mcp
      MEMU_MCP_ALLOWED_HOSTS: '["127.0.0.1","localhost","${MEMU_PUBLIC_HOST}"]'
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client; c=http.client.HTTPConnection('127.0.0.1',5071,timeout=5); c.request('GET','/readyz'); r=c.getresponse(); raise SystemExit(0 if r.status==200 else 1)"
      interval: 150s
      timeout: 8s
      retries: 2
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  caddy:
    image: ${MEMU_CADDY_IMAGE:-caddy:2-alpine}
    profiles: [https]
    network_mode: host
    environment:
      MEMU_PUBLIC_HOST: ${MEMU_PUBLIC_HOST:?Set MEMU_PUBLIC_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: ["/tmp:size=16m,mode=1777"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  caddy_data:
  caddy_config:
