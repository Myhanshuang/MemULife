name: Critical checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MEMU_TEST_POSTGRES_DSN: postgresql://postgres:test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[postgres,test,acquisition]'
      - run: python -m ruff check memu
      - run: python -m pytest -q tests/test_deployment.py tests/test_release.py tests/test_reliability.py tests/test_batching.py tests/test_index.py tests/test_local_ai_memory.py tests/test_local_ai_bulk.py tests/test_view_scheduling.py tests/test_source_projection.py
