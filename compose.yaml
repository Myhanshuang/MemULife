name: memulife

x-auth: &auth
  MEMU_MCP_TOKENS: '{"owner":"${MEMU_OWNER_TOKEN:?Run ops/bootstrap.py}","agent1":"${MEMU_AGENT_TOKEN:?Run ops/bootstrap.py}"}'

x-core-environment: &core-environment
  <<: *auth
  MEMU_DATABASE_URL: postgresql://memu:${POSTGRES_PASSWORD:?Run ops/bootstrap.py}@postgres:5432/memu?connect_timeout=5
  MEMU_MEMORY_ROOT: /data/memory
  MEMU_CORE_HOST: 0.0.0.0
  MEMU_CORE_ALLOWED_HOSTS: '["localhost","127.0.0.1","memu-core"]'
  MEMU_CORE_MAX_BODY_BYTES: '201326592'
  MEMU_ACCESS_WHITELIST: '{"owner":["read","write"],"agent1":["read","write"]}'
  MEMU_ACCESS_OWNERS: '["owner"]'
  MEMU_TIMEZONE: ${MEMU_TIMEZONE:-Asia/Shanghai}
  MLLM_BASE_URL: ${MLLM_BASE_URL:?Configure model endpoint}
  MLLM_MODEL_NAME: ${MLLM_MODEL_NAME:?Configure model name}
  MLLM_API_KEY: ${MLLM_API_KEY:-}
  MLLM_PROTOCOL: ${MLLM_PROTOCOL:-llamacpp}
  MLLM_TIMEOUT_SECONDS: ${MLLM_TIMEOUT_SECONDS:-600}
  EMB_BACKEND: ${EMB_BACKEND:-vllm_gemma}
  EMB_BASE_URL: ${EMB_BASE_URL:?Configure embedding endpoint}
  EMB_MODEL_NAME: ${EMB_MODEL_NAME:?Configure embedding name}
  EMB_MODEL_REVISION: ${EMB_MODEL_REVISION:?Configure immutable embedding revision}
  EMB_API_KEY: ${EMB_API_KEY:-}

x-app: &app
  restart: unless-stopped
  read_only: true
  tmpfs: ['/tmp:size=268435456,mode=1777']
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [memu]

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: memu
      POSTGRES_DB: memu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ops/bootstrap.py}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    networks: [memu]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U memu -d memu']
      interval: 150s
      start_interval: 5s
      start_period: 30s
      timeout: 5s
      retries: 3

  init:
    <<: *app
    image: memulife-core:1.3.0
    build: {context: ., target: core}
    restart: 'no'
    command: [init]
    environment: *core-environment
    volumes: [memory-data:/data]
    depends_on:
      postgres: {condition: service_healthy}

  memu-core:
    <<: *app
    image: memulife-core:1.3.0
    build: {context: ., target: core}
    command: [core]
    environment: *core-environment
    volumes: [memory-data:/data]
    extra_hosts: [host.docker.internal:host-gateway]
    stop_grace_period: 900s
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5072/readyz',timeout=5).read()"]
      interval: 150s
      start_interval: 5s
      start_period: 60s
      timeout: 10s
      retries: 3

  memu-mcp:
    <<: *app
    image: memulife-mcp:1.3.0
    build: {context: ., target: mcp}
    environment:
      <<: *auth
      MEMU_CORE_URL: http://memu-core:5072
      MEMU_CORE_TIMEOUT_SECONDS: '600'
      MEMU_MCP_HOST: 0.0.0.0
      MEMU_MCP_ALLOWED_HOSTS: ${MEMU_MCP_ALLOWED_HOSTS:-["localhost","127.0.0.1","memu-mcp"]}
      MEMU_MCP_ALLOWED_ORIGINS: ${MEMU_MCP_ALLOWED_ORIGINS:-[]}
      MEMU_MCP_WRITE_ENABLED: ${MEMU_MCP_WRITE_ENABLED:-true}
    ports: ['${MEMU_MCP_BIND:-127.0.0.1}:${MEMU_MCP_PORT:-5071}:5071']
    depends_on:
      memu-core: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5071/readyz',timeout=5).read()"]
      interval: 150s
      start_interval: 5s
      start_period: 30s
      timeout: 10s
      retries: 3

  memu-acquisition:
    <<: *app
    image: memulife-acquisition:1.3.0
    build: {context: ., target: acquisition}
    environment:
      <<: *auth
      MEMU_DATABASE_URL: postgresql://memu:${POSTGRES_PASSWORD:?Run ops/bootstrap.py}@postgres:5432/memu?connect_timeout=5
      MEMU_CORE_URL: http://memu-core:5072
      MEMU_CORE_TIMEOUT_SECONDS: '600'
      MEMU_ACQUISITION_HOST: 0.0.0.0
      MEMU_ACQUISITION_ROOT: /data/acquisition
      MEMU_ACQUISITION_ALLOWED_HOSTS: ${MEMU_ACQUISITION_ALLOWED_HOSTS:-["localhost","127.0.0.1","memu-acquisition"]}
      MEMU_ACQUISITION_ALLOWED_ORIGINS: ${MEMU_ACQUISITION_ALLOWED_ORIGINS:-["http://127.0.0.1:5073","http://localhost:5073"]}
      MEMU_ACCESS_WHITELIST: '{"owner":["read","write"],"agent1":["read","write"]}'
      MEMU_ACCESS_OWNERS: '["owner"]'
    volumes: [acquisition-data:/data]
    extra_hosts: [host.docker.internal:host-gateway]
    stop_grace_period: 180s
    ports: ['${MEMU_ACQUISITION_BIND:-127.0.0.1}:${MEMU_ACQUISITION_PORT:-5073}:5073']
    depends_on:
      memu-core: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5073/readyz',timeout=5).read()"]
      interval: 150s
      start_interval: 5s
      start_period: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
  memory-data:
  acquisition-data:
networks:
  memu:
